# Colour theme. Every attribute under [layers.<layer>.<class>] is copied as an
# SVG presentation attribute (so it works in any editor), lengths in mm;
# `casing-width` (mm on each side) and `casing-color` draw an outline under the line.

[page]
background = "#f7f4ee"
ink = "#333333"
frame-width = 0.3

[layers.water.water]
fill = "#aad3df"
stroke = "none"

[layers.water.stream]
fill = "none"
stroke = "#aad3df"
stroke-width = 0.2
stroke-linecap = "round"

[layers.water.canal]
fill = "none"
stroke = "#aad3df"
stroke-width = 0.4
stroke-linecap = "round"

[layers.water.river]
fill = "none"
stroke = "#aad3df"
stroke-width = 0.7
stroke-linecap = "round"

[layers.green.green]
fill = "#cde5b0"
stroke = "none"

[layers.buildings.building]
fill = "#d9d0c9"
stroke = "#b8a99d"
stroke-width = 0.1

[layers.railways.rail]
fill = "none"
stroke = "#777777"
stroke-width = 0.35
stroke-dasharray = "1.6 1.6"

[layers.railways.tram]
fill = "none"
stroke = "#999999"
stroke-width = 0.2

[layers.roads.path]
fill = "none"
stroke = "#c28b7a"
stroke-width = 0.15
stroke-dasharray = "0.8 0.5"

[layers.roads.service]
fill = "none"
stroke = "#ffffff"
stroke-width = 0.3
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.minor]
fill = "none"
stroke = "#ffffff"
stroke-width = 0.55
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.07
casing-color = "#d8cfc4"

[layers.roads.secondary]
fill = "none"
stroke = "#fdd9a0"
stroke-width = 0.8
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.09
casing-color = "#e3b878"

[layers.roads.major]
fill = "none"
stroke = "#f9a97d"
stroke-width = 1.1
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.11
casing-color = "#d9875a"

# Labels. font-size is in mm on paper; the white stroke behind the letters is a halo.

[layers.street-names.minor]
font-family = "sans-serif"
font-size = 1.5
fill = "#444444"
stroke = "#ffffff"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "sans-serif"
font-size = 1.8
fill = "#333333"
stroke = "#ffffff"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "sans-serif"
font-size = 2.1
font-weight = "bold"
fill = "#333333"
stroke = "#ffffff"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "sans-serif"
font-size = 2.4
fill = "#555555"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "sans-serif"
font-size = 3.0
fill = "#333333"
stroke = "#ffffff"
stroke-width = 0.7
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "sans-serif"
font-size = 3.8
font-weight = "bold"
fill = "#222222"
stroke = "#ffffff"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "sans-serif"
font-size = 5.0
font-weight = "bold"
fill = "#111111"
stroke = "#ffffff"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with LAYERS=…,hillshade,contours). The shade is a picture: `shadow`
# and `highlight` are its colours, not SVG attributes; flat ground stays clear.

[layers.hillshade.shade]
shadow = "#3d3a52"
highlight = "#fffbe6"
opacity = 0.5

[layers.contours.minor]
fill = "none"
stroke = "#b8946a"
stroke-width = 0.08
stroke-opacity = 0.8

[layers.contours.major]
fill = "none"
stroke = "#a07a4c"
stroke-width = 0.18

# Administrative boundaries (only with INCLUDE_LAYERS=boundaries,municipalities,parishes),
# in purple: dash and dots, longer and heavier the higher the level.

[layers.parishes.parish]
fill = "none"
stroke = "#9a68aa"
stroke-width = 0.22
stroke-dasharray = "0.4 0.4"

[layers.municipalities.municipality]
fill = "none"
stroke = "#7b3f8c"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5"

[layers.boundaries.district]
fill = "none"
stroke = "#7b3f8c"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5 0.3 0.5 0.3 0.5"

[layers.boundaries.province]
fill = "none"
stroke = "#7b3f8c"
stroke-width = 0.4
stroke-dasharray = "1.8 0.5 0.35 0.5"

[layers.boundaries.region]
fill = "none"
stroke = "#7b3f8c"
stroke-width = 0.5
stroke-dasharray = "2 0.6 0.4 0.6 0.4 0.6"

[layers.boundaries.country]
fill = "none"
stroke = "#7b3f8c"
stroke-width = 0.6
stroke-dasharray = "2.4 0.6 0.4 0.6"
