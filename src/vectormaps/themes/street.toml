# Street theme, in the manner of the web street maps: light grey ground, light blue
# water, soft green, white streets with a grey outline and yellow main roads.
# Every attribute under [layers.<layer>.<class>] is copied as an SVG presentation
# attribute, lengths in mm; `casing-width` (mm on each side) and `casing-color`
# draw an outline under the line instead.

[page]
background = "#f5f5f3"
ink = "#3c4043"
frame-width = 0.3

[layers.water.water]
fill = "#aadaff"
stroke = "none"

[layers.water.stream]
fill = "none"
stroke = "#aadaff"
stroke-width = 0.25
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.canal]
fill = "none"
stroke = "#aadaff"
stroke-width = 0.5
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.river]
fill = "none"
stroke = "#aadaff"
stroke-width = 0.9
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.green.green]
fill = "#c8e6b8"
stroke = "none"

[layers.buildings.building]
fill = "#e4e3df"
stroke = "#cfcdc8"
stroke-width = 0.08

[layers.railways.rail]
fill = "none"
stroke = "#b0b0b0"
stroke-width = 0.3
stroke-linecap = "round"

[layers.railways.tram]
fill = "none"
stroke = "#c4c4c4"
stroke-width = 0.2
stroke-linecap = "round"

[layers.roads.path]
fill = "none"
stroke = "#c2c2be"
stroke-width = 0.15
stroke-dasharray = "0.6 0.4"

[layers.roads.service]
fill = "none"
stroke = "#ffffff"
stroke-width = 0.3
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.07
casing-color = "#d0d0cb"

[layers.roads.minor]
fill = "none"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.09
casing-color = "#c4c4bf"

[layers.roads.secondary]
fill = "none"
stroke = "#ffffff"
stroke-width = 0.9
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.11
casing-color = "#b5b5b0"

[layers.roads.major]
fill = "none"
stroke = "#fde293"
stroke-width = 1.2
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.13
casing-color = "#e8b54a"

# Labels. font-size is in mm on paper; the white stroke behind the letters is a halo.
# Roboto if the system has it, any sans-serif if not.

[layers.street-names.minor]
font-family = "Roboto, Arial, sans-serif"
font-size = 1.5
fill = "#5f6368"
stroke = "#ffffff"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "Roboto, Arial, sans-serif"
font-size = 1.8
fill = "#4d5156"
stroke = "#ffffff"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.0
font-weight = "bold"
fill = "#3c4043"
stroke = "#ffffff"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.4
fill = "#70757a"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "Roboto, Arial, sans-serif"
font-size = 3.0
fill = "#4d5156"
stroke = "#ffffff"
stroke-width = 0.7
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "Roboto, Arial, sans-serif"
font-size = 3.8
font-weight = "bold"
fill = "#3c4043"
stroke = "#ffffff"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "Roboto, Arial, sans-serif"
font-size = 5.0
font-weight = "bold"
fill = "#202124"
stroke = "#ffffff"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with INCLUDE_LAYERS=hillshade,contours). The shade is a picture:
# `shadow` and `highlight` are its colours, not SVG attributes; flat ground stays clear.

[layers.hillshade.shade]
shadow = "#4a4f5a"
highlight = "#ffffff"
opacity = 0.35

[layers.contours.minor]
fill = "none"
stroke = "#cfc6b4"
stroke-width = 0.08
stroke-opacity = 0.8

[layers.contours.major]
fill = "none"
stroke = "#b8ac94"
stroke-width = 0.16

# Administrative boundaries (only with INCLUDE_LAYERS=boundaries,municipalities,parishes),
# in grey violet: dash and dots, longer and heavier the higher the level.

[layers.parishes.parish]
fill = "none"
stroke = "#a3a3b5"
stroke-width = 0.22
stroke-dasharray = "0.4 0.4"

[layers.municipalities.municipality]
fill = "none"
stroke = "#7e7e94"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5"

[layers.boundaries.district]
fill = "none"
stroke = "#7e7e94"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5 0.3 0.5 0.3 0.5"

[layers.boundaries.province]
fill = "none"
stroke = "#7e7e94"
stroke-width = 0.4
stroke-dasharray = "1.8 0.5 0.35 0.5"

[layers.boundaries.region]
fill = "none"
stroke = "#7e7e94"
stroke-width = 0.5
stroke-dasharray = "2 0.6 0.4 0.6 0.4 0.6"

[layers.boundaries.country]
fill = "none"
stroke = "#7e7e94"
stroke-width = 0.6
stroke-dasharray = "2.4 0.6 0.4 0.6"

# Nov 5: a hamlet (a "lugar") between a neighbourhood and a village; the names
# of rivers, lakes and parks, in italics, in the colour of the water and the green.
[layers.places.hamlet]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.7
fill = "#70757a"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.water-names.stream]
font-family = "Roboto, Arial, sans-serif"
font-size = 1.7
font-style = "italic"
fill = "#2f6fb0"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"

[layers.water-names.river]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.2
font-style = "italic"
fill = "#2f6fb0"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"

[layers.water-names.lake]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.5
font-style = "italic"
fill = "#2f6fb0"
stroke = "#aadaff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.green-names.reserve]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.3
font-style = "italic"
fill = "#2f7a3d"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.green-names.park]
font-family = "Roboto, Arial, sans-serif"
font-size = 2.0
font-style = "italic"
fill = "#2f7a3d"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"
