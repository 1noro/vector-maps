# Black and white theme, made to print on a mono laser/inkjet printer: greys
# only, no large black areas (ink), and widths that stay legible on paper.

[page]
background = "#ffffff"
ink = "#000000"
frame-width = 0.3

# Water is one grey with no outline, areas and lines alike, so a river melts into the
# wider stretches mapped as areas (Nov 4). Solid lines: dashes are paths.
[layers.water.water]
fill = "#c0c0c0"
stroke = "none"

[layers.water.stream]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 0.3
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.canal]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 0.6
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.river]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 1.2
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.green.green]
fill = "#f0f0f0"
stroke = "none"

[layers.buildings.building]
fill = "#bdbdbd"
stroke = "#000000"
stroke-width = 0.1

[layers.railways.rail]
fill = "none"
stroke = "#000000"
stroke-width = 0.35
stroke-dasharray = "1.6 1.6"

[layers.railways.tram]
fill = "none"
stroke = "#555555"
stroke-width = 0.2

[layers.roads.path]
fill = "none"
stroke = "#000000"
stroke-width = 0.12
stroke-dasharray = "0.8 0.5"

[layers.roads.service]
fill = "none"
stroke = "#000000"
stroke-width = 0.2
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.minor]
fill = "none"
stroke = "#000000"
stroke-width = 0.35
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.secondary]
fill = "none"
stroke = "#000000"
stroke-width = 0.6
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.major]
fill = "none"
stroke = "#000000"
stroke-width = 0.9
stroke-linecap = "round"
stroke-linejoin = "round"

# Labels. font-size is in mm on paper; the white stroke behind the letters is a halo.

[layers.street-names.minor]
font-family = "sans-serif"
font-size = 1.5
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "sans-serif"
font-size = 1.8
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "sans-serif"
font-size = 2.1
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "sans-serif"
font-size = 2.4
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "sans-serif"
font-size = 3.0
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.7
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "sans-serif"
font-size = 3.8
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "sans-serif"
font-size = 5.0
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with LAYERS=…,hillshade,contours). The shade is a picture: `shadow`
# and `highlight` are its colours, not SVG attributes; flat ground stays clear.

[layers.hillshade.shade]
shadow = "#000000"
highlight = "#ffffff"
opacity = 0.35

[layers.contours.minor]
fill = "none"
stroke = "#808080"
stroke-width = 0.08

[layers.contours.major]
fill = "none"
stroke = "#505050"
stroke-width = 0.16
