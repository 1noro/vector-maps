# Black and white theme, made to print on a mono laser/inkjet printer: greys
# only, no large black areas (ink), and widths that stay legible on paper.

[page]
background = "#ffffff"
ink = "#000000"
frame-width = 0.3

# Water is one grey with no outline, areas and lines alike, so a river melts into the
# wider stretches mapped as areas (Nov 4). Solid lines: dashes are paths.
[layers.water.water]
fill = "#c0c0c0"
stroke = "none"

[layers.water.stream]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 0.3
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.canal]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 0.6
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.river]
fill = "none"
stroke = "#c0c0c0"
stroke-width = 1.2
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.green.green]
fill = "#f0f0f0"
stroke = "none"

[layers.buildings.building]
fill = "#bdbdbd"
stroke = "#000000"
stroke-width = 0.1

[layers.railways.rail]
fill = "none"
stroke = "#000000"
stroke-width = 0.35
stroke-dasharray = "1.6 1.6"

[layers.railways.tram]
fill = "none"
stroke = "#555555"
stroke-width = 0.2

[layers.roads.path]
fill = "none"
stroke = "#000000"
stroke-width = 0.12
stroke-dasharray = "0.8 0.5"

[layers.roads.service]
fill = "none"
stroke = "#000000"
stroke-width = 0.2
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.minor]
fill = "none"
stroke = "#000000"
stroke-width = 0.35
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.secondary]
fill = "none"
stroke = "#000000"
stroke-width = 0.6
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.roads.major]
fill = "none"
stroke = "#000000"
stroke-width = 0.9
stroke-linecap = "round"
stroke-linejoin = "round"

# Labels. font-size is in mm on paper; the white stroke behind the letters is a halo.

[layers.street-names.minor]
font-family = "sans-serif"
font-size = 1.5
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "sans-serif"
font-size = 1.8
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "sans-serif"
font-size = 2.1
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "sans-serif"
font-size = 2.4
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "sans-serif"
font-size = 3.0
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.7
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "sans-serif"
font-size = 3.8
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "sans-serif"
font-size = 5.0
font-weight = "bold"
fill = "#000000"
stroke = "#ffffff"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with LAYERS=…,hillshade,contours). The shade is a picture: `shadow`
# and `highlight` are its colours, not SVG attributes; flat ground stays clear.

[layers.hillshade.shade]
shadow = "#000000"
highlight = "#ffffff"
opacity = 0.35

[layers.contours.minor]
fill = "none"
stroke = "#808080"
stroke-width = 0.08

[layers.contours.major]
fill = "none"
stroke = "#505050"
stroke-width = 0.16

# Administrative boundaries (only with INCLUDE_LAYERS=boundaries,municipalities,parishes),
# in black over a see-through grey band (`casing-opacity`; monochrome tints it). What
# tells them from the paths, which are plain dashes, is the round dots: parishes all
# dots, the rest dash and dot(s), longer and heavier the higher the level. A dot is a
# dash of 0.01 mm with round ends (Inkscape drops dashes of exactly 0 from the PDF).

[layers.parishes.parish]
fill = "none"
stroke = "#000000"
stroke-width = 0.3
stroke-dasharray = "0.01 0.7"
stroke-linecap = "round"
casing-width = 0.3
casing-color = "#000000"
casing-opacity = 0.1

[layers.municipalities.municipality]
fill = "none"
stroke = "#000000"
stroke-width = 0.3
stroke-dasharray = "1.2 0.6 0.01 0.6"
stroke-linecap = "round"
casing-width = 0.5
casing-color = "#000000"
casing-opacity = 0.12

[layers.boundaries.district]
fill = "none"
stroke = "#000000"
stroke-width = 0.35
stroke-dasharray = "1.2 0.6 0.01 0.6 0.01 0.6"
stroke-linecap = "round"
casing-width = 0.6
casing-color = "#000000"
casing-opacity = 0.12

[layers.boundaries.province]
fill = "none"
stroke = "#000000"
stroke-width = 0.45
stroke-dasharray = "2 0.7 0.01 0.7"
stroke-linecap = "round"
casing-width = 0.75
casing-color = "#000000"
casing-opacity = 0.15

[layers.boundaries.region]
fill = "none"
stroke = "#000000"
stroke-width = 0.5
stroke-dasharray = "2 0.7 0.01 0.7 0.01 0.7"
stroke-linecap = "round"
casing-width = 0.9
casing-color = "#000000"
casing-opacity = 0.15

[layers.boundaries.country]
fill = "none"
stroke = "#000000"
stroke-width = 0.6
stroke-dasharray = "2.6 0.8 0.01 0.8"
stroke-linecap = "round"
casing-width = 1.0
casing-color = "#000000"
casing-opacity = 0.18

# Nov 5: a hamlet (a "lugar") between a neighbourhood and a village; the names
# of rivers, lakes and parks, in italics, in the colour of the water and the green.
[layers.places.hamlet]
font-family = "sans-serif"
font-size = 2.7
fill = "#000000"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.water-names.stream]
font-family = "sans-serif"
font-size = 1.7
font-style = "italic"
fill = "#404040"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"

[layers.water-names.river]
font-family = "sans-serif"
font-size = 2.2
font-style = "italic"
fill = "#404040"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"

[layers.water-names.lake]
font-family = "sans-serif"
font-size = 2.5
font-style = "italic"
fill = "#404040"
stroke = "#c0c0c0"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.green-names.reserve]
font-family = "sans-serif"
font-size = 2.3
font-style = "italic"
fill = "#404040"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.green-names.park]
font-family = "sans-serif"
font-size = 2.0
font-style = "italic"
fill = "#404040"
stroke = "#ffffff"
stroke-width = 0.6
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"
