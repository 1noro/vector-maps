# Vintage theme, in the manner of a 19th-century topographic survey sheet: cream
# paper, hatched turquoise water, meadows in short green dashes, hatched dark
# buildings, roads as fine black double lines, and italic serif lettering.
# The hills come out in red with the relief (INCLUDE_LAYERS=hillshade,contours).
#
# Lengths in mm. `casing-width` (mm on each side) and `casing-color` draw an outline
# under a line. `fill = "pattern:<name>"` fills with one of the [patterns.<name>]:
# kind = "lines" (parallel lines `spacing` mm apart, at `angle` degrees, `width`
# thick, dashes `dash` mm long if given) or "dots" (`radius`), in `color`, over
# `background` (none if not given).

[page]
background = "#f4ecd2"
ink = "#2b2622"
frame-width = 0.5

[patterns.water]
kind = "lines"
spacing = 0.45
width = 0.06
color = "#6fb2bd"
background = "#d3e8e0"

[patterns.meadow]
kind = "lines"
spacing = 0.9
dash = 0.5
width = 0.08
color = "#5f9a86"
background = "#ebeccf"

[patterns.houses]
kind = "lines"
spacing = 0.3
angle = 45
width = 0.09
color = "#3b3532"
background = "#c9b8a6"

[layers.water.water]
fill = "pattern:water"
stroke = "#3f8fa0"
stroke-width = 0.15

[layers.water.stream]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.25
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.canal]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.4
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.river]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.7
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.green.green]
fill = "pattern:meadow"
stroke = "none"

[layers.buildings.building]
fill = "pattern:houses"
stroke = "#2b2622"
stroke-width = 0.07

[layers.railways.rail]
fill = "none"
stroke = "#1e1a17"
stroke-width = 0.35

[layers.railways.tram]
fill = "none"
stroke = "#3b3532"
stroke-width = 0.15

[layers.roads.path]
fill = "none"
stroke = "#3b3532"
stroke-width = 0.12
stroke-dasharray = "0.7 0.45"

[layers.roads.service]
fill = "none"
stroke = "#f7efd8"
stroke-width = 0.25
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.05
casing-color = "#2b2622"

[layers.roads.minor]
fill = "none"
stroke = "#f7efd8"
stroke-width = 0.4
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.06
casing-color = "#2b2622"

[layers.roads.secondary]
fill = "none"
stroke = "#f7efd8"
stroke-width = 0.55
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.07
casing-color = "#2b2622"

[layers.roads.major]
fill = "none"
stroke = "#efc7a0"
stroke-width = 0.75
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.08
casing-color = "#1e1a17"

# Labels: all italic, in EB Garamond (in the image; DejaVu Serif elsewhere).
# font-size is in mm on paper; the stroke behind the letters is a halo of paper.

[layers.street-names.minor]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 1.6
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.4
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 1.9
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 2.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 2.6
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 3.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.65
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 4.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 5.8
font-style = "italic"
letter-spacing = 0.3
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with INCLUDE_LAYERS=hillshade,contours), red as the hills of the old
# survey sheets. The shade is a picture: `shadow` and `highlight` are its colours,
# not SVG attributes; flat ground stays clear.

[layers.hillshade.shade]
shadow = "#c8643c"
highlight = "#fff6dc"
opacity = 0.5

[layers.contours.minor]
fill = "none"
stroke = "#e09070"
stroke-width = 0.07
stroke-opacity = 0.9

[layers.contours.major]
fill = "none"
stroke = "#c8643c"
stroke-width = 0.14
