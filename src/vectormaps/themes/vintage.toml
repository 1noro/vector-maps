# Vintage theme, in the manner of a 19th-century topographic survey sheet: cream
# paper, pale water lined along its shores, meadows in staggered green crosses, hatched dark
# buildings, roads as fine black double lines, and italic serif lettering.
# The hills come out in red hatching with the relief (INCLUDE_LAYERS=hillshade,contours).
#
# Lengths in mm. `casing-width` (mm on each side) and `casing-color` draw an outline
# under a line. `fill = "pattern:<name>"` fills with one of the [patterns.<name>]:
# kind = "lines" (parallel lines `spacing` mm apart, at `angle` degrees, `width`
# thick, dashes `dash` mm long if given), "dots" (`radius`) or "crosses" ("+" `size` mm
# across, `width` thick; `stagger` moves every other row half a step), in `color`, over
# `background` (none if not given).

# The cream paper is the map only; the margin around it is white (`margin`).
[page]
background = "#f4ecd2"
margin = "#ffffff"
ink = "#2b2622"
frame-width = 0.5

[patterns.meadow]
kind = "crosses"
spacing = 2.0
size = 0.6
width = 0.1
stagger = true
color = "#4f7a4a"
background = "#e6e9c6"

[patterns.houses]
kind = "lines"
spacing = 0.3
angle = 45
width = 0.09
color = "#3b3532"
background = "#c9b8a6"

# Rivers and canals join the lakes as one body of water (`join`: at the width they
# are drawn; the streams stop at its edge), and lines follow the shore inside it,
# `shore-lines` mm in, as on engraved sheets.
[layers.water.water]
fill = "#dcece4"
stroke = "#3f8fa0"
stroke-width = 0.2
join = ["canal", "river"]
shore-lines = [0.35, 0.8, 1.4, 2.2]
shore-color = "#5fa3b3"
shore-width = 0.08

[layers.water.stream]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.25
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.canal]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.4
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.water.river]
fill = "none"
stroke = "#4f9db0"
stroke-width = 0.7
stroke-linecap = "round"
stroke-linejoin = "round"

[layers.green.green]
fill = "pattern:meadow"
stroke = "none"

[layers.buildings.building]
fill = "pattern:houses"
stroke = "#2b2622"
stroke-width = 0.07

[layers.railways.rail]
fill = "none"
stroke = "#1e1a17"
stroke-width = 0.35

[layers.railways.tram]
fill = "none"
stroke = "#3b3532"
stroke-width = 0.15

# Roads: a light fill inside a black double line, wide enough to read over the red
# hatching of the relief; the more important, the wider and the warmer the fill.

[layers.roads.path]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.16
stroke-dasharray = "0.8 0.45"

[layers.roads.service]
fill = "none"
stroke = "#fdf8ea"
stroke-width = 0.3
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.08
casing-color = "#2b2622"

[layers.roads.minor]
fill = "none"
stroke = "#fdf8ea"
stroke-width = 0.5
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.1
casing-color = "#1e1a17"

[layers.roads.secondary]
fill = "none"
stroke = "#f7e3a1"
stroke-width = 0.7
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.12
casing-color = "#1e1a17"

[layers.roads.major]
fill = "none"
stroke = "#efbf4f"
stroke-width = 0.95
stroke-linecap = "round"
stroke-linejoin = "round"
casing-width = 0.14
casing-color = "#1e1a17"

# Labels: all italic, in EB Garamond (in the image; DejaVu Serif elsewhere).
# font-size is in mm on paper; the stroke behind the letters is a halo of paper.

[layers.street-names.minor]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 1.6
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.4
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.secondary]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 1.9
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.45
stroke-linejoin = "round"
paint-order = "stroke"

[layers.street-names.major]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 2.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.5
stroke-linejoin = "round"
paint-order = "stroke"

[layers.places.suburb]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 2.6
font-style = "italic"
fill = "#2b2622"
stroke = "#f4ecd2"
stroke-width = 0.55
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.village]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 3.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.65
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.town]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 4.2
font-style = "italic"
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 0.8
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

[layers.places.city]
font-family = "EB Garamond, DejaVu Serif, serif"
font-size = 5.8
font-style = "italic"
letter-spacing = 0.3
fill = "#1e1a17"
stroke = "#f4ecd2"
stroke-width = 1.0
stroke-linejoin = "round"
paint-order = "stroke"
text-anchor = "middle"

# Relief (only with INCLUDE_LAYERS=hillshade,contours), red as the hills of the old
# survey sheets. No shading: the slopes are hatched in red, denser the steeper they
# are. Each band draws its lines where the ground is steeper than `slope` degrees:
# `spacing` mm apart, at `angle` degrees, `width` thick, moved `offset` mm across (so
# two bands at the same angle interleave instead of overlapping).

[layers.hillshade.shade]
style = "hatch"
bands = [
  { slope = 6, spacing = 0.9, angle = 30, width = 0.08, color = "#c8643c" },
  { slope = 12, spacing = 0.9, angle = 30, width = 0.08, color = "#c8643c", offset = 0.45 },
  { slope = 20, spacing = 0.6, angle = -30, width = 0.09, color = "#8a3a1e" },
]

[layers.contours.minor]
fill = "none"
stroke = "#e09070"
stroke-width = 0.07
stroke-opacity = 0.9

[layers.contours.major]
fill = "none"
stroke = "#c8643c"
stroke-width = 0.14

# Administrative boundaries (only with INCLUDE_LAYERS=boundaries,municipalities,parishes),
# as on the hand-coloured survey sheets: an ink line over a see-through band of violet
# (`casing-opacity`), wider and longer-dashed the higher the level. The parishes are a
# row of round dots (dashes of 0.01 mm with round ends), not dashes like the paths.

[layers.parishes.parish]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.3
stroke-dasharray = "0.01 0.7"
stroke-linecap = "round"
casing-width = 0.3
casing-color = "#8e5ea2"
casing-opacity = 0.25

[layers.municipalities.municipality]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5"
casing-width = 0.5
casing-color = "#8e5ea2"
casing-opacity = 0.3

[layers.boundaries.district]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.3
stroke-dasharray = "1.2 0.5 0.3 0.5 0.3 0.5"
casing-width = 0.6
casing-color = "#8e5ea2"
casing-opacity = 0.3

[layers.boundaries.province]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.4
stroke-dasharray = "1.8 0.5 0.35 0.5"
casing-width = 0.75
casing-color = "#8e5ea2"
casing-opacity = 0.35

[layers.boundaries.region]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.5
stroke-dasharray = "2 0.6 0.4 0.6 0.4 0.6"
casing-width = 0.9
casing-color = "#8e5ea2"
casing-opacity = 0.35

[layers.boundaries.country]
fill = "none"
stroke = "#2b2622"
stroke-width = 0.6
stroke-dasharray = "2.4 0.6 0.4 0.6"
casing-width = 1.0
casing-color = "#8e5ea2"
casing-opacity = 0.4
